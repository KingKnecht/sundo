[package]
name = "sundo"
version = "0.2.2"
edition = "2024"
license = "MIT"
description = "Snapshot-based undo/redo library with support for persistent data structures"
repository = "https://github.com/kingknecht/sundo"
keywords = ["undo", "redo", "history", "snapshot", "persistent"]
categories = ["data-structures", "algorithms"]
readme = "README.md"
exclude = ["demos/", "docs/", ".vscode/", ".gitignore"]

[features]
default = ["persistent", "im"]
# `PersistentUndoRedo` and friends. No dependencies: implement `Persistent` for your own snapshot types.
persistent = []
# `Persistent` / `MemoryFootprint` impls for the `im` crate.
im = ["persistent", "dep:im"]
# `Persistent` / `MemoryFootprint` impls for the `imbl` crate (the maintained fork of `im`).
imbl = ["persistent", "dep:imbl"]

[dependencies]
im = { version = "15.1", optional = true }
imbl = { version = "7", optional = true }

